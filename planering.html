<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Märkesschema – Planering</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gullbrandstorps Scoutkårs Märken</h1>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Märkesbibliotek</a>
            <a href="planering.html" class="nav-link active">Märkesschema</a>
        </nav>
    </header>

    <div class="planning-toolbar">
        <h2 class="planning-title">Märkesschema</h2>
        <div class="toolbar-actions">
            <button id="exportPlanningBtn" class="btn-secondary" type="button">Spara</button>
            <button id="importPlanningBtn" class="btn-secondary" type="button">Öppna...</button>
            <button id="exportPlanningPdfBtn" class="btn-secondary" type="button">PDF</button>
            <input id="importPlanningInput" type="file" accept="application/json,.json" hidden>
            <button id="addGroupBtn" class="btn-primary" type="button">+ Lägg till planering</button>
        </div>
    </div>

    <div class="planning-filters">
        <label class="filter-field search-field">
            <span>Sök planering</span>
            <input id="groupSearchInput" type="text" placeholder="Sök efter planering...">
        </label>
        <label class="filter-field">
            <span>Målgrupp</span>
            <select id="groupLevelFilter">
                <option value="Alla">Alla målgrupper</option>
                <option value="Familjescouting">Familjescouting</option>
                <option value="Spårare">Spårare</option>
                <option value="Upptäckare">Upptäckare</option>
                <option value="Äventyrare">Äventyrare</option>
                <option value="Utmanare">Utmanare</option>
                <option value="Rover">Rover</option>
            </select>
        </label>
    </div>

    <main id="planningGrid"></main>

    <div id="exportInfoModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="exportInfoTitle">
        <div class="modal-content">
            <button class="close-popup" type="button" id="closeExportInfoModal" aria-label="Stäng">&times;</button>
            <h2 id="exportInfoTitle">Export klar</h2>
            <div id="exportInfoBody"></div>
            <div class="modal-actions">
                <button id="closeExportInfoBtn" class="btn-primary" type="button">OK</button>
            </div>
        </div>
    </div>

    <div id="pdfSelectionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pdfSelectionTitle">
        <div class="modal-content pdf-selection-content">
            <button class="close-popup" type="button" id="closePdfSelectionModal" aria-label="Stäng">&times;</button>
            <h2 id="pdfSelectionTitle">Välj planeringar till PDF</h2>
            <p class="pdf-selection-intro">Markera de planeringar som ska ingå i PDF-filen.</p>
            <label class="filter-field pdf-selection-filter">
                <span>Målgrupp</span>
                <select id="pdfPlanningFilter" aria-label="Filtrera planeringar efter målgrupp"></select>
            </label>
            <div id="pdfSelectionList" class="pdf-selection-list"></div>
            <div class="modal-actions pdf-selection-actions">
                <button id="selectAllPdfBtn" class="btn-secondary" type="button">Markera alla</button>
                <button id="clearPdfBtn" class="btn-secondary" type="button">Rensa</button>
                <button id="generatePdfBtn" class="btn-primary" type="button">Skapa PDF</button>
            </div>
        </div>
    </div>

    <!-- Modal: Lägg till planering -->
    <div id="groupModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
        <div class="modal-content">
            <button class="close-popup" type="button" id="closeGroupModal">&times;</button>
            <h2 id="groupModalTitle">Ny plannering</h2>
            <label class="modal-field">
                <span>Namn</span>
                <input id="groupName" type="text" placeholder="t.ex. År 1 - HT">
            </label>
            <label class="modal-field">
                <span>Målgrupp</span>
                <select id="groupLevel">
                    <option value="Familjescouting">Familjescouting</option>
                    <option value="Spårare">Spårare</option>
                    <option value="Upptäckare">Upptäckare</option>
                    <option value="Äventyrare">Äventyrare</option>
                    <option value="Utmanare">Utmanare</option>
                    <option value="Rover">Rover</option>
                </select>
            </label>
            <div class="modal-actions modal-actions--split">
                <button id="loadDefaultsBtn" class="btn-secondary" type="button">Standardplaneringar</button>
                <button id="saveGroupBtn" class="btn-primary" type="button">Spara</button>
            </div>
        </div>
    </div>

    <!-- Modal: Standardplaneringar -->
    <div id="defaultPlanningModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="defaultPlanningTitle">
        <div class="modal-content">
            <button class="close-popup" type="button" id="closeDefaultPlanningModal">&times;</button>
            <h2 id="defaultPlanningTitle">Lägg till standardplaneringar</h2>
            <label class="modal-field">
                <span>Målgrupp</span>
                <select id="defaultPlanningLevel">
                    <option value="Familjescouting">Familjescouting</option>
                    <option value="Spårare">Spårare</option>
                    <option value="Upptäckare">Upptäckare</option>
                    <option value="Äventyrare">Äventyrare</option>
                    <option value="Utmanare">Utmanare</option>
                    <option value="Rover">Rover</option>
                </select>
            </label>
            <div class="modal-actions">
                <button id="saveDefaultPlanningBtn" class="btn-primary" type="button">Lägg till</button>
            </div>
        </div>
    </div>

    <!-- Modal: Välj märken -->
    <div id="badgePickerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <div class="modal-content modal-content--wide">
            <button class="close-popup" type="button" id="closeBadgePicker">&times;</button>
            <h2 id="pickerTitle">Välj märken</h2>
            <div class="picker-filters">
                <input id="pickerSearch" type="text" placeholder="Sök märke..." class="picker-search-input">
                <select id="pickerTargetGroupFilter">
                    <option value="Alla">Alla målgrupper</option>
                </select>
                <select id="pickerCategoryFilter">
                    <option value="Alla">Alla kategorier</option>
                </select>
            </div>
            <div id="pickerGrid" class="picker-grid"></div>
        </div>
    </div>

    <script src="js/planering.js"></script>
</body>
</html>
