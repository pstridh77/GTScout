<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoutmärken</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="utility-bar">
            <span class="utility-spacer" aria-hidden="true"></span>
            <nav class="utility-nav" aria-label="Externa länkar">
                <a href="https://www.scouterna.se/" target="_blank" rel="noreferrer">Scouterna</a>
                <a href="https://www.scoutnet.se/" target="_blank" rel="noreferrer">Scoutnet</a>
                <a href="https://www.scoutshop.se/" target="_blank" rel="noreferrer">Scoutshop</a>
            </nav>
            <div id="authArea" class="auth-area"></div>
        </div>
        <div class="header-main">
            <a class="site-brand" href="index.html" aria-label="Gullbrandstorps scoutkår">
                <img src="images/icons/GTorp_banner.png" alt="Gullbrandstorps Scoutkår" class="site-brand-banner">
            </a>
            <nav class="main-nav" aria-label="Huvudnavigation">
            <a href="index.html" class="nav-link active">Märkesbibliotek</a>
            <a href="planering.html" class="nav-link">Märkesschema</a>
            </nav>
            <div class="site-menu">
                <button id="siteMenuBtn" class="header-menu-button" type="button" aria-label="Meny" aria-expanded="false" title="Meny">
                    <span></span><span></span><span></span>
                </button>
                <div id="siteMenuDropdown" class="site-menu-dropdown hidden" role="menu">
                    <div class="planning-menu-section-label">Navigering</div>
                    <a href="index.html" class="site-menu-item" role="menuitem">Märkesbibliotek</a>
                    <a href="planering.html" class="site-menu-item" role="menuitem">Märkesschema</a>
                    <div class="planning-menu-divider" role="separator"></div>
                    <div class="planning-menu-section-label">Funktioner</div>
                    <button class="planning-menu-item hidden" type="button" role="menuitem" data-create-custom-badge>Skapa eget märke</button>
                    <button id="editActivitiesBtn" class="planning-menu-item" type="button" role="menuitem">Hantera aktiviteter</button>
                    <button class="planning-menu-item hidden" type="button" role="menuitem" data-admin-panel>Administration</button>
                    <div class="planning-menu-divider" role="separator"></div>
                    <button id="showMissingBadgesBtn" class="planning-menu-item planning-toggle-item" type="button" role="menuitem" aria-pressed="false"><span>Visa saknade märken</span><span class="planning-toggle-status" aria-hidden="true"></span></button>
                    <div class="planning-menu-divider" role="separator"></div>
                    <div class="site-menu-environment-note database-environment"></div>
                    <div class="site-menu-version-note">v1.0.0 (2026-08-30)</div>
                </div>
            </div>
        </div>
    </header>
     
    <div id="details">
        <h2>Välj ett märke</h2>
        <p>Klicka på ett märke för att visa information.</p>
    </div>

    <div class="filters" aria-label="Filtrera märken">
        <label class="filter-field search-field">
            <span>Sök märken</span>
            <input id="searchInput" type="text" placeholder="Sök efter namn eller ord...">
        </label>
        
        <label class="filter-field">
            <span>Typ</span>
            <select id="typeFilter">
                <option value="Alla">Alla typer</option>
            </select>
        </label>

        <label class="filter-field">
            <span>Kategori</span>
            <select id="categoryFilter">
                <option value="Alla">Alla kategorier</option>
            </select>
        </label>

        <label class="filter-field">
            <span>Målgrupp</span>
            <select id="targetGroupFilter">
                <option value="Alla">Alla målgrupper</option>
            </select>
        </label>

        

        <label class="filter-field">
            <span>Program</span>
            <select id="programFilter">
                <option value="Alla">Alla program</option>
            </select>
        </label>
    </div>
    
    <main id="badgeGrid"></main>

    <footer class="site-footer" aria-label="Sidfot och version">
        <div class="site-footer-content">
            <span class="site-footer-title">GTScout</span>
            <span class="site-footer-dot" aria-hidden="true">•</span>
            <span class="site-footer-version">v1.0.0</span>
            <span class="site-footer-dot" aria-hidden="true">•</span>
            <span class="site-footer-build">Byggd 2026-08-30</span>
            <span class="site-footer-dot" aria-hidden="true">•</span>
            <span id="databaseEnvironment" class="database-environment"></span>
        </div>
    </footer>

    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-config.local.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/activities-sync.js"></script>
    <script src="js/badges-sync.js"></script>
    <script src="js/notes-sync.js"></script>
    <script src="js/version.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
