<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouter – GTScout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header site-header--planning">
        <div class="utility-bar"><span class="utility-spacer" aria-hidden="true"></span><nav class="utility-nav" aria-label="Externa länkar"><a href="https://www.scouterna.se/" target="_blank" rel="noreferrer">Scouterna</a><a href="https://www.scoutnet.se/" target="_blank" rel="noreferrer">Scoutnet</a><a href="https://www.scoutshop.se/" target="_blank" rel="noreferrer">Scoutshop</a></nav><div id="authArea" class="auth-area"></div></div>
        <div class="header-main">
            <a class="site-brand" href="index.html" aria-label="Gullbrandstorps scoutkår"><img src="images/icons/GTorp_banner.png" alt="Gullbrandstorps Scoutkår" class="site-brand-banner"></a>
            <nav class="main-nav" aria-label="Huvudnavigation"><a href="index.html" class="nav-link">Märken</a><a href="planering.html" class="nav-link">Planering</a><a href="scouter.html" class="nav-link active">Scouter</a></nav>
        </div>
    </header>
    <main class="scouts-page">
        <header class="scouts-page-header"><div><p class="scouts-kicker">Kårens översikt</p><h1>Scouter</h1><p>Följ märkesstatus för varje scout. Klicka på en status för att växla mellan ej påbörjad, pågår och klar.</p></div><button id="addScoutBtn" class="btn-primary" type="button">+ Lägg till scout</button></header>
        <div class="scouts-toolbar"><label class="filter-field"><span>Sök scout</span><input id="scoutSearch" type="search" placeholder="Sök namn..."></label><label class="filter-field"><span>Födelseår</span><select id="scoutYearFilter"><option value="Alla">Alla år</option></select></label><span id="scoutsStatus" class="planning-sync-status" role="status"></span></div>
        <div id="scoutsEmpty" class="scouts-empty hidden">Inga scouter ännu. Lägg till den första scouten för att börja följa märken.</div>
        <div class="scouts-table-wrap"><table class="scouts-table"><thead id="scoutsTableHead"></thead><tbody id="scoutsTableBody"></tbody></table></div>
    </main>
    <div id="scoutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="scoutModalTitle"><div class="modal-content"><button id="closeScoutModal" class="close-popup" type="button" aria-label="Stäng">&times;</button><h2 id="scoutModalTitle">Lägg till scout</h2><label class="modal-field"><span>Namn</span><input id="scoutName" type="text" required></label><label class="modal-field"><span>Födelseår</span><input id="scoutBirthYear" type="number" min="1900" max="2200" step="1" required></label><p id="scoutModalStatus" class="detail-planning-status" role="status"></p><div class="modal-actions"><button id="saveScoutBtn" class="btn-primary" type="button">Lägg till</button></div></div></div>
    <footer class="site-footer" aria-label="Sidfot och version"><div class="site-footer-content"><span class="site-footer-title">GTScout</span><span class="site-footer-dot" aria-hidden="true">•</span><span class="site-footer-version">v1.0.0</span></div></footer>
    <script src="js/supabase-config.js"></script><script src="js/supabase-config.local.js"></script><script src="js/auth.js"></script><script src="js/admin.js"></script><script src="js/badges-sync.js"></script><script src="js/scouts-sync.js"></script><script src="js/scouts.js"></script>
</body>
</html>
